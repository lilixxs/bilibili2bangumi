<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilibili2Bangumi</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 340px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #333;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }
    .logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #fb7299, #ff85a2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
    }
    .title {
      flex: 1;
    }
    .title h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fb7299;
    }
    .title p {
      font-size: 12px;
      color: #999;
      margin-top: 2px;
    }
    .section {
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #666;
      margin-bottom: 8px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
    }
    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group select:focus {
      border-color: #fb7299;
    }
    .form-group input[type="password"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input[type="password"]:focus {
      border-color: #fb7299;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .checkbox-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .inline-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      margin-left: 24px;
    }
    .inline-group input[type="number"] {
      width: 60px;
      padding: 4px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      text-align: center;
      font-size: 14px;
    }
    .inline-group span {
      font-size: 13px;
      color: #666;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #fb7299;
      color: white;
    }
    .btn-primary:hover {
      background: #ff85a2;
    }
    .btn-secondary {
      background: #f5f5f5;
      color: #666;
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: #eee;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-row .btn {
      flex: 1;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: #f0f9ff;
      border-radius: 6px;
      font-size: 13px;
      color: #1890ff;
      margin-bottom: 16px;
    }
    .status::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #52c41a;
      border-radius: 50%;
    }
    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #eee;
      text-align: center;
      font-size: 12px;
      color: #999;
    }
    .footer a {
      color: #fb7299;
      text-decoration: none;
    }
    .toast {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      background: #52c41a;
      color: white;
      border-radius: 6px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">📺</div>
    <div class="title">
      <h1>bilibili2bangumi</h1>
      <p>版本 <span id="extension-version"></span></p>
    </div>
  </div>

  <div class="status">
    扩展已启用，在B站视频页面可用
  </div>

  <div class="section">
    <div class="section-title">Bangumi 配置</div>
    <div class="form-group">
      <label for="access-token">Access Token</label>
      <input type="password" id="access-token" placeholder="输入 Bangumi Access Token">
    </div>
  </div>

  <div class="section">
    <div class="section-title">同步设置</div>
    <div class="form-group">
      <label for="auto-sync-mode">自动同步模式</label>
      <select id="auto-sync-mode">
        <option value="off">关闭</option>
        <option value="assist">辅助模式</option>
        <option value="auto">全自动模式</option>
      </select>
    </div>
    <div class="form-group">
      <label class="checkbox-group">
        <input type="checkbox" id="enable-dedup">
        <span>防重复同步</span>
      </label>
      <div class="inline-group">
        <span>同一集在</span>
        <input type="number" id="dedup-hours" min="1" max="720" value="24">
        <span>小时内不重复</span>
      </div>
    </div>
    <div class="form-group">
      <label class="checkbox-group">
        <input type="checkbox" id="hide-on-wide">
        <span>宽屏/全屏自动隐藏悬浮球</span>
      </label>
    </div>
  </div>

  <button class="btn btn-primary" id="save-settings">保存设置</button>

  <div class="btn-row">
    <button class="btn btn-secondary" id="open-settings">页面内设置</button>
    <button class="btn btn-secondary" id="open-github">GitHub</button>
  </div>

  <div class="footer">
    <a href="https://next.bgm.tv/demo/access-token" target="_blank">获取 Token</a>
  </div>

  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
